<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>
<body class="flex min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-slate-200">
<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<main class="flex-1 p-6 md:p-10">
    <div class="mx-auto max-w-6xl space-y-8">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <a href="/#http-status-guide" class="inline-flex items-center gap-2 text-sm text-cyan-300 transition hover:text-cyan-200">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回 HTTP 状态码总览</span>
                </a>
                <div class="mt-4 flex flex-wrap items-center gap-4">
                    <div class="font-mono text-5xl font-semibold text-cyan-300" th:text="${status.code}">500</div>
                    <div>
                        <h1 class="text-3xl font-semibold text-white" th:text="${status.title}">Internal Server Error</h1>
                        <span class="mt-2 inline-flex rounded-full px-3 py-1 text-xs font-semibold"
                              th:classappend="' ' + ${status.badgeClass}"
                              th:text="${status.category}">服务器错误</span>
                    </div>
                </div>
                <p class="mt-5 max-w-3xl text-base leading-7 text-slate-300" th:text="${status.summary}">
                    摘要
                </p>
            </div>
        </div>

        <section class="grid gap-6 xl:grid-cols-[1.5fr_1fr]">
            <article class="rounded-3xl border border-slate-700 bg-slate-900/75 p-6 shadow-[0_18px_50px_rgba(15,23,42,0.4)]">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-lg font-semibold text-white">这是什么意思</h2>
                        <p class="mt-3 text-sm leading-7 text-slate-300" th:text="${status.explanation}">讲解</p>
                    </div>

                    <div class="rounded-2xl border border-slate-700/80 bg-slate-950/70 p-5">
                        <h2 class="text-lg font-semibold text-white">生活里的比喻</h2>
                        <p class="mt-3 text-sm leading-7 text-slate-300" th:text="${status.analogy}">比喻</p>
                    </div>

                    <div>
                        <h2 class="text-lg font-semibold text-white">常见出现方式</h2>
                        <ul class="mt-3 space-y-3 text-sm leading-7 text-slate-300">
                            <li th:each="item : ${status.commonCases}" class="rounded-2xl border border-slate-700/80 bg-slate-800/60 px-4 py-3">
                                <span th:text="${item}">常见场景</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </article>

            <div class="space-y-6">
                <section class="rounded-3xl border border-cyan-500/20 bg-cyan-500/5 p-6">
                    <h2 class="text-lg font-semibold text-white">前端收到后怎么处理</h2>
                    <ul class="mt-4 space-y-3 text-sm leading-7 text-slate-200">
                        <li th:each="item : ${status.frontendActions}" class="rounded-2xl border border-cyan-500/20 bg-slate-900/80 px-4 py-3">
                            <span th:text="${item}">前端处理</span>
                        </li>
                    </ul>
                </section>

                <section class="rounded-3xl border border-rose-500/20 bg-rose-500/5 p-6">
                    <h2 class="text-lg font-semibold text-white">后端排查重点</h2>
                    <ul class="mt-4 space-y-3 text-sm leading-7 text-slate-200">
                        <li th:each="item : ${status.backendChecks}" class="rounded-2xl border border-rose-500/20 bg-slate-900/80 px-4 py-3">
                            <span th:text="${item}">后端排查</span>
                        </li>
                    </ul>
                </section>
            </div>
        </section>

        <section class="rounded-3xl border border-slate-700 bg-slate-900/70 p-6">
            <div class="mb-5 flex items-center justify-between gap-4">
                <div>
                    <span class="font-mono text-xs uppercase tracking-[0.3em] text-cyan-300">Next Reading</span>
                    <h2 class="mt-2 text-xl font-semibold text-white">继续查看其他状态码</h2>
                </div>
                <a href="/#http-status-guide" class="text-sm text-cyan-300 transition hover:text-cyan-200">返回总览</a>
            </div>

            <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                <a th:each="item : ${httpStatuses}"
                   th:href="@{/http-status/{code}(code=${item.code})}"
                   class="rounded-2xl border border-slate-700 bg-slate-800/70 px-4 py-4 transition hover:border-cyan-400/60 hover:bg-slate-800">
                    <div class="font-mono text-lg font-semibold text-cyan-300" th:text="${item.code}">404</div>
                    <div class="mt-1 text-sm font-medium text-white" th:text="${item.title}">Not Found</div>
                    <div class="mt-2 text-xs text-slate-400" th:text="${item.summary}">摘要</div>
                </a>
            </div>
        </section>
    </div>
</main>
</body>
</html>
