<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<section th:fragment="http-status-guide(statuses)" id="http-status-guide"
         class="rounded-3xl border border-cyan-500/20 bg-slate-900/70 p-6 shadow-[0_18px_50px_rgba(6,182,212,0.12)]">
    <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
        <div>
            <span class="font-mono text-xs uppercase tracking-[0.35em] text-cyan-300">HTTP Field Guide</span>
            <h2 class="mt-2 text-2xl font-semibold text-white">网络错误与常见 HTTP 状态码</h2>
        </div>
        <p class="max-w-2xl text-sm leading-6 text-slate-400">
            把协议层里的状态码翻译成更容易记住的语言。现在每个状态码都可以进入单独页面，查看讲解、常见场景、前端处理方式和后端排查方向。
        </p>
    </div>

    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
        <a th:each="status : ${statuses}"
           th:href="@{/http-status/{code}(code=${status.code})}"
           class="block rounded-2xl border border-slate-700 bg-slate-800/80 p-5 transition hover:-translate-y-1 hover:border-cyan-400/60 hover:shadow-[0_16px_30px_rgba(8,145,178,0.18)]">
            <div class="mb-4 flex items-start justify-between gap-3">
                <div>
                    <div class="font-mono text-2xl font-semibold text-cyan-300" th:text="${status.code}">404</div>
                    <h3 class="mt-1 text-lg font-semibold text-white" th:text="${status.title}">Not Found</h3>
                </div>
                <span class="rounded-full px-3 py-1 text-xs font-semibold"
                      th:classappend="' ' + ${status.badgeClass}"
                      th:text="${status.category}">客户端错误</span>
            </div>

            <p class="mb-4 rounded-xl border border-slate-700/80 bg-slate-950/70 px-4 py-3 text-sm leading-6 text-slate-200"
               th:text="${status.summary}">
                状态总结
            </p>

            <div class="space-y-3 text-sm leading-6 text-slate-300">
                <div>
                    <span class="mb-1 block font-semibold text-slate-100">讲解</span>
                    <p th:text="${status.explanation}">解释</p>
                </div>
                <div>
                    <span class="mb-1 block font-semibold text-slate-100">比喻</span>
                    <p th:text="${status.analogy}">比喻</p>
                </div>
            </div>
            <div class="mt-4 flex items-center justify-between border-t border-slate-700/80 pt-4 text-sm text-cyan-300">
                <span>进入单页讲解</span>
                <i class="fas fa-arrow-right"></i>
            </div>
        </a>
    </div>
</section>
</html>
